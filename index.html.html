<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Feranmi’s Studio</title>
  <link rel="stylesheet" href="style.css" />
  <!-- AOS Library for Animations -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body>
  <header data-aos="fade-down">
    <h1>Feranmi Bello</h1>
    <p>Creative Designer & Digital Builder</p>
  </header>

  <main>
    <section data-aos="fade-up" data-aos-delay="200">
      <h2>About</h2>
      <p>I design experiences, build digital products, and turn ideas into reality.</p>
    </section>

    <section data-aos="fade-up" data-aos-delay="400">
      <h2>Skills</h2>
      <p>Graphic Design • Video Editing • Web Development • Social Media Strategy</p>
    </section>

    <section data-aos="fade-up" data-aos-delay="600">
      <button id="theme-toggle">🌙 Toggle Dark Mode</button>
    </section>
  </main>

  <footer data-aos="fade-in" data-aos-delay="800">
    <p>© 2025 Feranmi’s Studio</p>
  </footer>

  <!-- AOS + Custom JS -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="script.js"></script>
</body>
</html>
